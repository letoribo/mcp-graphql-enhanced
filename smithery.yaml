name: mcp-graphql-enhanced
description: Federated Bridge for GraphQL with filtered introspection and variable support.
transport:
  type: http
  url: "https://mcp-graphql-enhanced.onrender.com/mcp"
configSchema:
  type: object
  required:
    - endpoint
  properties:
    endpoint:
      type: string
      description: The GraphQL server endpoint URL.
    headers:
      type: string
      description: Optional JSON string of headers.
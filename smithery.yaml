name: mcp-graphql-enhanced
description: Federated Bridge for GraphQL with filtered introspection and variable support.
transport:
  - type: stdio
  - type: http
    port: 6274
startCommand:
  command: "node"
  args: ["dist/index.js"]
  env:
    ENDPOINT: "{{endpoint}}"
    HEADERS: "{{headers}}"
    MCP_HTTP_PORT: "6274"
configSchema:
  type: object
  required:
    - endpoint
  properties:
    endpoint:
      type: string
      description: The GraphQL server endpoint URL.
    headers:
      type: string
      description: Optional JSON string of headers.
